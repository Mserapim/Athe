<table border="0" cellborder="0">
  {% if not legend_on_top %}
  <tr><td height="100"></td></tr>
  {% endif %}
  <tr>
    <td>
      <table border="1" cellborder="0" cellspacing="4">
        <tr>
          <td colspan="6" height="50"><b><font face="Arial" point-size="12">Legenda</font></b></td>
        </tr>
        <tr>
          <td width="25"></td>
          <td>
            <table border="1" style="rounded" cellborder="0" bgcolor="{{ NOT_RECEIVED }}">
              <tr><td>Não Recebido</td></tr>
            </table>
          </td>
          <td>
            <table border="1" style="rounded" cellborder="0" bgcolor="{{ RECEIVED }}">
              <tr><td>Recebido</td></tr>
            </table>
          </td>
          <td>
            <table border="1" style="rounded" cellborder="0" bgcolor="{{ FINISHED }}">
              <tr><td>Finalizado</td></tr>
            </table>
          </td>
          <td>
            <table border="1" style="rounded" cellborder="0" bgcolor="{{ REOPENED }}">
              <tr><td>Reaberto</td></tr>
            </table>
          </td>
          <td width="25"></td>
        </tr>
        <tr>
          <td colspan="6" height="20"></td>
        </tr>
      </table>
    </td>
  </tr>
  {% if legend_on_top %}
  <tr><td height="100"></td></tr>
  {% endif %}
</table>

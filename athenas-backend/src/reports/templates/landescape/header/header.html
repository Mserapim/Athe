<!DOCTYPE html>
<header style="background-color: rgb(240, 240, 240);border: 2px solid rgb(97, 97, 97)">
    <div style="width: 100%;height: 10%;margin-bottom: 90px;">
      <div style="float: left;width: 9%;">
        <ul style="list-style-type: none; margin-left: 5px; padding-left: 0px;font-size: 15px">
          <li>
            <img src="data:image/png;base64,{{logo_mpmt}}" style="padding-top: 12px;padding-bottom: 12px;" width="110px" height="35px" alt="MPMT">
          </li>
          
        </ul>
      </div>
      <div style="float: left;width:80%;">
        <center><h2 style="margin-top:30px;color: rgb(71, 69, 69); font-size:20px;font-family: Georgia, arial, sans-serif;padding-bottom: 5px">
           {{ title }}
        </h2></center> 

      </div>
      <div style="float:left;;width: 11%;">
        <ul style="list-style-type: none; margin-left: 10%; padding-left: 0px;font-size: 15px;padding-top: 12px;padding-bottom: 12px;">
          <li>
            Emissão: {{date}}        
          </li>
          <li>
            Hora: {{ hour }}
          </li>
        </ul>
      </div>
    </div>
</header>

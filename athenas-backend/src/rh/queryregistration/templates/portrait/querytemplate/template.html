{% load helpers_format %}
{% load config_format %}
{% load dict_filter %}

<html>
  <head>
    <meta name="pdfkit-orientation" content="Portrait"/>
    <meta name="pdfkit-page-size" content="A4"/>
    <meta charset="UTF-8">

    <style type="text/css">


      tr { 
        page-break-inside:avoid; 
        page-break-after:auto 
      }

      table {
        font-family: Georgia, arial, sans-serif;
        border-collapse: collapse;
        width: 100%;
        float: left;
        page-break-inside:auto; 
        margin-bottom: 40px;
        table-layout: auto !important;
      }

      td, th {
        border: 2px solid #747272;
        text-align: left;
        font-size: 14px;
        padding: 8px;

      }

      table td div {height:18px;overflow:hidden;}

      table tr th{
        font-weight: 200
      }
    
    
      h3{
        font-size: 14px;
      }

  </style>
  </head>
  <body style="height:100%;width:100%;margin:0;padding: 0; font-family: 'Times New Roman', Times, serif;color: #333;">
    
    {% include 'portrait/header/header.html' %}
    
    
    <section style="margin-top:50px;margin-bottom:20px;clear: both;">
          <div>
            <table>
              <thead style="border: none;">
                <tr>
                    {% for key in keys %}
                      <th style="font-size: 14px;font-weight:600;text-transform: uppercase;background-color:rgb(240, 240, 240)">{{ key }}</th>
                    {% endfor %}
                </tr>
              </thead>
              <tbody>
                {% for item in data %}
                    <tr>
                      {% for value in item  %}
                        <td>
                            <div>{{ item|get_value:value }}</div>
                        </td>
                      {% endfor %}
                    <tr>
                {% endfor  %}      

                   
              </tbody> 
            </table>
    
          </div>

    </section>
   

   
  </body>
</html>

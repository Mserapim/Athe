<div class="papper">
    {% block header %}
    <div class="papper-header">
        <div class="papper-header-logo"></div>
        <div>
            <p class="papper-header-system">Atendimento ao Cidadão</p>
            <p class="papper-header-instituation">Ministério Público do Estado do Tocantins</p>
        </div>
        <div style="clean:both"></div>
    </div>
    {% endblock %}

    <div class="composite">
        {% block protocol %}{% endblock %}

        {% block content %}{% endblock %}

    </div>

    {% block sign %}{% endblock %}

    {% block aware %}{% endblock %}

</div>

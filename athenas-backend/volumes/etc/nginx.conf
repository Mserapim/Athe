user user user;
worker_processes 8;
error_log /app/var/log/err.txt;
worker_rlimit_nofile 8192;
daemon off;

events {
 worker_connections 2048;
}


http {
 #include "/app/etc/upstream.conf";
 upstream athenas {
 server worker:3000;
 }
 include "/etc/nginx/mime.types";

 default_type application/octet-stream;
 log_format main '$remote_addr - ($status) - $request';
 sendfile on;
 tcp_nopush on;
 client_body_temp_path /app/var/cache/nginx-body;
 access_log /app/var/log/log.txt;
 error_log /app/var/log/err.txt;

 client_max_body_size 10M;
 large_client_header_buffers 8 16k;
 client_header_buffer_size 16k;

 gzip on;
 gzip_disable "msie6";
 gzip_vary on;
 gzip_proxied any;
 gzip_comp_level 6;
 gzip_buffers 16 8k;
 gzip_http_version 1.1;
 gzip_min_length 256;
 gzip_types text/plain text/css application/json application/x-javascript application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

 map $http_upgrade $connection_upgrade {
 default upgrade;
 '' close;
 }

 server {
 listen 8000;

 rewrite ^/?$ /athenas/ permanent;

 include "/app/etc/location.conf";

 location /athenas {
 proxy_pass http://athenas;
 include /etc/nginx/proxy_params;
 }

 location /ws {
 proxy_pass http://daphne:7000;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 }
 }

 include /app/etc/ssl/*.conf;
}

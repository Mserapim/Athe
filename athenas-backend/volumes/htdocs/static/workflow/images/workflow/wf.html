<html>
    <head>
        <style type="text/css"> 
        .box { 
            display: block; 
            float: left; 
            padding: 3px;
            width: 300px;
        } 

        .box-icon {
            float: left;
            margin-right: 5px;
        }

        .box-text {
            font-size: 10px;
        }

        .cell {
            float:left;
            width:120px;
            text-align:center;
            padding: 3px;
            border: 1px solid #DDD;
            margin: 3px;
            border-radius: 3px;
        }

        a {
            text-decoration: none;
            color: blue;
        }

        a:hover {
            color: red;
        }

        </style>
        <link rel="stylesheet" type="text/css" href="wf.css">
    </head>

    <body>
        <section>
            <a name="indice"></a>
            <h1>Indice</h1>
            
            <div class="cell"><a href="#16x16">16x16</a></div>
            
            <div style="clear:both"></div>
        </section>

        
        <section>
            <div id='slot-16-16'>
                <a name="16x16"></a>
                <h1>Icones 16x16</h1>
                
                <div class="box">
                    <div class="box-icon icon-wf icon-employeevertex" style="width:16px;height:16px"></div>
                    <div class="box-text" style="line-height:16px">icon-wf icon-employeevertex</div>
                </div>
                
                <div class="box">
                    <div class="box-icon icon-wf icon-personvertex" style="width:16px;height:16px"></div>
                    <div class="box-text" style="line-height:16px">icon-wf icon-personvertex</div>
                </div>
                
                <div class="box">
                    <div class="box-icon icon-wf icon-jokervertex" style="width:16px;height:16px"></div>
                    <div class="box-text" style="line-height:16px">icon-wf icon-jokervertex</div>
                </div>
                
                <div class="box">
                    <div class="box-icon icon-wf icon-workplacevertex" style="width:16px;height:16px"></div>
                    <div class="box-text" style="line-height:16px">icon-wf icon-workplacevertex</div>
                </div>
                
            </div>
            <div style="clear:both"></div>
            <p><a href="#indice">Voltar ao indice</a></p>
        </section>
        
    </body>
</html>

<p-table [columns]="service.colunasVisiveis | async" [value]="service.listagem$ | async" [paginator]="false" [rows]="10"
    [rowsPerPageOptions]="[10, 15, 20, 30, 50, 100]" [expandedRowKeys]="expandedRows" dataKey="id" size="small"
    [scrollable]="true" (sortFunction)="customSort($event)" [customSort]="permiteReordenarLinhas"
    (onRowReorder)="aoReordenarLinha($event)" [loading]="service.loading$ | async">
    <ng-template pTemplate="header" let-columns style="min-height: 42px !important;">
        <tr>
            <th style="width: 5rem" *ngIf="permiteReordenarLinhas" pFrozenColumn></th>
            <th style="width: 5rem" *ngIf="temConteudoExpandido" pFrozenColumn>
                <p-button type="button" *ngIf="!tabelaExpandida" pRipple (onClick)="expandirTodasLinhas()" [text]="true"
                    [rounded]="true" [plain]="true" icon="pi pi-chevron-right" />
                <p-button type="button" *ngIf="tabelaExpandida" pRipple (onClick)="colapsarTodasLinhas()" [text]="true"
                    [rounded]="true" [plain]="true" icon="pi pi-chevron-down" />
            </th>
            <th *ngFor="let col of columns" [pSortableColumn]="col.codigo">
                <div class="flex flex-row gap-1 items-center">
                    {{ col.titulo }}
                    <p-sortIcon [field]="col.codigo" *ngIf="col.ordenavel" class="text-gray-400 text-xs w-4 h-4"
                        size="small" />
                </div>
            </th>
            <th class="relative" *ngIf="service.acoes$ | async " pFrozenColumn alignFrozen="right"></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData let-columns="columns" let-expanded="expanded" let-index="rowIndex">
        <tr [pReorderableRow]="index" class="w-full overflow-hidden">
            <td *ngIf="permiteReordenarLinhas">
                <span class="pi pi-bars" pReorderableRowHandle></span>
            </td>

            <td *ngIf="temConteudoExpandido">
                <p-button type="button" pRipple [pRowToggler]="rowData" [text]="true" [rounded]="true" [plain]="true"
                    [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'" />
            </td>

            <!-- columnas-->
            <td *ngFor="let col of columns">
                <mpmt-pagina-listagem-tabela-celula-texto *ngIf="col.tipo == 'TEXTO'" [coluna]="col"
                    [linha]="rowData"></mpmt-pagina-listagem-tabela-celula-texto>

                <mpmt-pagina-listagem-tabela-celula-numerico *ngIf="col.tipo == 'NUMERICO'" [coluna]="col"
                    [linha]="rowData"></mpmt-pagina-listagem-tabela-celula-numerico>
                    
                <mpmt-pagina-listagem-tabela-celula-data *ngIf="col.tipo == 'DATA'" [coluna]="col"
                    [linha]="rowData"></mpmt-pagina-listagem-tabela-celula-data>

                <mpmt-pagina-listagem-tabela-celula-data-hora *ngIf="col.tipo == 'DATA_HORA'" [coluna]="col"
                    [linha]="rowData"></mpmt-pagina-listagem-tabela-celula-data-hora>
                
                <mpmt-pagina-listagem-tabela-celula-objeto *ngIf="col.tipo == 'OBJETO'" [coluna]="col"
                    [linha]="rowData"></mpmt-pagina-listagem-tabela-celula-objeto>

                <mpmt-pagina-listagem-tabela-celula-boleano-icone *ngIf="col.tipo == 'BOLEANO_ICONE'" [coluna]="col"
                    [linha]="rowData"></mpmt-pagina-listagem-tabela-celula-boleano-icone>

                <mpmt-pagina-listagem-tabela-celula-acoes *ngIf="col.tipo == 'ACOES'" [coluna]="col"
                    [linha]="rowData"></mpmt-pagina-listagem-tabela-celula-acoes>
            </td>

            <!-- acoes-->
            <td class="relative" *ngIf="service.acoes$ | async">
                <p-menu #menu [model]="acoesVisiveisPorLinha(rowData) | async" [popup]="true" [appendTo]="'body'"
                    styleClass="w-60">
                    <ng-template #item let-item>
                        <a pRipple class="flex items-center p-menu-item-link" (click)="aoClicarAcao(item, rowData)">
                            <span [class]="item.icon"></span>
                            <mat-icon *ngIf="item.icone" class="mr-2">{{ item.icone }}</mat-icon>
                            <span class="ml-2">{{ item.titulo }}</span>
                        </a>
                    </ng-template>
                </p-menu>
                <p-button type="button" pRipple (click)="menu.toggle($event);$event.stopPropagation()" [text]="true"
                    *ngIf="(acoesVisiveisPorLinha(rowData)|async).length > 0" [rounded]="true" [plain]="true"
                    [icon]="'pi pi-ellipsis-v'" />
            </td>


        </tr>
    </ng-template>
    <ng-template #expandedrow let-rowData>
        <tr class="0  h-min ">
            <td [attr.colspan]="999" class="!w-full ">
                <ng-container *ngTemplateOutlet="conteudoExpandido2; context: { $implicit: rowData }"></ng-container>
            </td>
        </tr>
    </ng-template>


</p-table>

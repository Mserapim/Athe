<div class="flex flex-col w-full h-full">
    <div
        class="flex flex-row gap-2 text-white items-center justify-between w-full py-4 x-0"
        [ngClass]="classes"
    >
        <mpmt-pagina-titulo
            [habilitar-favorito]="habilitarFavorito"
            *ngIf="!ocultarTitulo"
        ></mpmt-pagina-titulo>

        <div class="flex flex-row w-min gap-2" *ngIf="!ocultarOpcoes">
            <button mat-icon-button [matMenuTriggerFor]="columnMenu">
                <mat-icon>visibility</mat-icon>
            </button>

            <button mat-icon-button [matMenuTriggerFor]="columnDownload">
                <mat-icon>file_download</mat-icon>
            </button>
        </div>
        <div *ngIf="ocultarOpcoes"></div>

        <mat-menu #columnMenu="matMenu">
            <ng-container *ngFor="let coluna of todasColunas">
                <ng-container *ngIf="coluna.codigo !== 'acoes'">
                <div>
                    <mat-checkbox
                        color="primary"
                        (change)="toggleColunaVisivel(coluna)"
                        [checked]="coluna.visivel"
                    >
                        {{ coluna.titulo }}
                    </mat-checkbox>
                </div>
                </ng-container>
            </ng-container>
        </mat-menu>

        <mat-menu #columnDownload="matMenu">
            <button
                mat-menu-item
                (click)="this.service.downloadCsv()"
                class="flex flex-row gap-2"
            >
                <div class="w-6 h-6 mr-2">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="1em"
                        height="1em"
                        viewBox="0 0 256 256"
                        class="w-6 h-6"
                    >
                        <path
                            fill="currentColor"
                            d="M48 180c0 11 7.18 20 16 20a14.24 14.24 0 0 0 10.22-4.66a8 8 0 0 1 11.56 11.06A30.06 30.06 0 0 1 64 216c-17.65 0-32-16.15-32-36s14.35-36 32-36a30.06 30.06 0 0 1 21.78 9.6a8 8 0 0 1-11.56 11.06A14.24 14.24 0 0 0 64 160c-8.82 0-16 9-16 20m79.6-8.69c-4-1.16-8.14-2.35-10.45-3.84c-1.25-.81-1.23-1-1.12-1.9a4.57 4.57 0 0 1 2-3.67c4.6-3.12 15.34-1.73 19.82-.56a8 8 0 0 0 4.15-15.48c-2.12-.55-21-5.22-32.84 2.76a20.58 20.58 0 0 0-9 14.95c-2 15.88 13.65 20.41 23 23.11c12.06 3.49 13.12 4.92 12.78 7.59c-.31 2.41-1.26 3.34-2.14 3.93c-4.6 3.06-15.17 1.56-19.55.36a8 8 0 0 0-4.31 15.44a61.3 61.3 0 0 0 15.19 2c5.82 0 12.3-1 17.49-4.46a20.82 20.82 0 0 0 9.19-15.23c2.19-17.31-14.32-22.14-24.21-25m83.09-26.84a8 8 0 0 0-10.23 4.84L188 184.21l-12.47-34.9a8 8 0 0 0-15.07 5.38l20 56a8 8 0 0 0 15.07 0l20-56a8 8 0 0 0-4.84-10.22M216 88v24a8 8 0 0 1-16 0V96h-48a8 8 0 0 1-8-8V40H56v72a8 8 0 0 1-16 0V40a16 16 0 0 1 16-16h96a8 8 0 0 1 5.66 2.34l56 56A8 8 0 0 1 216 88m-27.31-8L160 51.31V80Z"
                        />
                    </svg>
                </div>
                <div>Exportar CSV</div>
            </button>
        </mat-menu>
    </div>
    
    <div class="flex justify-end w-full">
        <ng-container *ngIf="!dragAtivo">
            <ng-content select="[acoes]"></ng-content>
        </ng-container>

        <div style="width: 16px;"></div>

        <ng-container *ngIf="dragAtivo; else viewMode">
            <mpmt-botao 
                (click)="cancelarEdicao()" 
                mat-raised-button 
                [cor]="'critico'"
                [tipo]="'preenchido'"
                >Cancelar
            </mpmt-botao>
            <div style="width: 16px;"></div>
            <mpmt-botao 
                (click)="salvarOrdem()" 
                mat-raised-button 
                [cor]="'sucesso'"
                [tipo]="'preenchido'"
                >Salvar
            </mpmt-botao>
        </ng-container>
        <ng-template #viewMode>
            <mpmt-botao (click)="ativarDragMode()" mat-raised-button>
                Editar ordem
            </mpmt-botao>
        </ng-template>
    </div>

    <div class="flex flex-row gap-2 w-full text-white py-2">
        <ng-content select="[filtros]"></ng-content>
    </div>

    <div class="flex flex-row w-full table-responsive rounded-b">

        <table 
            mat-table 
            [dataSource]="localData" 
            class="mat-elevation-z8" 
            matSort 
            (matSortChange)="service.alterarOrdenacao($event)" 
            cdkDropList
            [cdkDropListData]="localData" 
            (cdkDropListDropped)="drop($event)"
        >
            <ng-container matColumnDef="dragHandle">
                <th mat-header-cell *matHeaderCellDef> Drag </th>
                <td mat-cell *matCellDef="let linha">
                    <div class="pr-2">
                        <mat-icon>drag_indicator</mat-icon>
                    </div>
                </td>
            </ng-container>
            
            <ng-container 
                [matColumnDef]="coluna.codigo" 
                *ngFor="let coluna of service.colunasVisiveis | async"
            >

                <th 
                    mat-header-cell 
                    *matHeaderCellDef 
                    mat-sort-header 
                    [disabled]="!coluna.ordenavel"
                >
                    {{ coluna.titulo }}
                </th>
                
                <td 
                    mat-cell 
                    *matCellDef="let linha"
                >   

                <div *ngIf="dragAtivo && first" class="pr-2">
                    <mat-icon>drag_indicator</mat-icon>
                </div>

                <div class="flex flex-col w-full h-full">
                    <!-- TIPO TEXTO -->
                    <div *ngIf="coluna.tipo == 'TEXTO'">
                        {{ linha[coluna.codigo] }}
                    </div>
                
                    <!-- TIPO DATA -->
                    <div *ngIf="coluna.tipo == 'DATA'">
                        {{ formatarData(linha[coluna.codigo]) }}
                    </div>
                
                    <!-- TIPO DATA HORA -->
                    <div *ngIf="coluna.tipo == 'DATA_HORA'">
                        {{ formatarDataHora(linha[coluna.codigo]) }}
                    </div>
                
                    <!-- TIPO BOLEANO -->
                    <div *ngIf="coluna.tipo == 'BOLEANO'">
                        {{ formatarBooleano(linha[coluna.codigo]) }}
                    </div>
                
                    <!-- TIPO ACOES -->
                    <div class="flex justify-end" *ngIf="coluna.tipo == 'ACOES'">
                        <ng-container *ngIf="!dragAtivo; else dragHandle">
                            <button mat-icon-button [matMenuTriggerFor]="editMenu">
                                <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #editMenu="matMenu">
                                <button
                                    mat-menu-item
                                    (click)="acao?.aoClicar(linha)"
                                    *ngFor="let acao of coluna?.acoes"
                                >
                                    <mat-icon>{{ acao.icone }}</mat-icon>
                                    {{ acao.titulo }}
                                </button>
                            </mat-menu>
                        </ng-container>
                        <ng-template #dragHandle>
                            <mat-icon class="px-12" color="primary">open_with</mat-icon>
                        </ng-template>
                    </div>
                </div>

                </td>
            </ng-container>
            <tr 
                mat-header-row 
                *matHeaderRowDef="service.colunaCodigos | async"
            ></tr>
            <tr 
                mat-row 
                *matRowDef="let row; columns: service.colunaCodigos | async" [cdkDragDisabled]="!dragAtivo" cdkDrag>
            ></tr>
        </table>
    </div>

    <div *ngIf="service.paginacao.per_page != null">
        <mat-paginator
            *ngIf="!dragAtivo" 
            [length]="service.total$ | async"
            [pageSize]="10"
            [pageSizeOptions]="[10, 15, 30, 50, 100]"
        ></mat-paginator>
    </div>
</div>

<div class="flex flex-col gap-2 self-center w-full justify-center rounded"
    (dragover)="onDragOver($event)" (drop)="onDrop($event)">
    <span style="font-weight: 500; color: rgba(var(--fuse-text-default-rgb), var(--tw-text-opacity));">{{titulo}}</span>

    <div class="flex flex-col gap-2">
        <button *ngIf="!isReadOnly && acceptMultiple" (click)="fileInput.click()"
            class="flex justify-between w-full gap-2 bg-white p-2 rounded border border-gray-300">
            <div class="flex gap-2">
                <div class="w-full">
                    <span class="text-black">Clique para adicionar um arquivo</span>
                </div>
            </div>
            <input #fileInput type="file" (change)="onFileInput($event)" [multiple]="acceptMultiple"
                [accept]="acceptedFileTypes.join(',')" style="display: none" />
            <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
        </button>
        <button *ngIf="!isReadOnly && !acceptMultiple" (click)="documentos.length == 0 ? fileInput.click() : null"
                class="flex justify-between w-full gap-2 bg-white p-2 rounded border border-gray-300">
            <div class="flex gap-2">
                <div class="w-full">
                    <span class="text-black">Clique para adicionar um arquivo</span>
                </div>
            </div>
            <input #fileInput type="file" (change)="onFileInput($event)"
                   [accept]="acceptedFileTypes.join(',')" style="display: none" />
            <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
        </button>
    </div>

    <div class="file-grid" *ngIf="documentos.length > 0">
        <div class="file-item" *ngFor="let documento of documentos" draggable="true"
            (dragstart)="onDragStart($event, documento.id)">
            <mat-icon [svgIcon]="'heroicons_outline:document'" class="file-icon" (click)="downloadArquivo(documento.id)"></mat-icon>
            <span class="file-name">{{ documento.originalName }}</span>
            <button *ngIf="!isReadOnly" mat-icon-button class="file-remove-button" (click)="removeItem(documento.id)">
                <mat-icon [svgIcon]="'heroicons_outline:x-circle'"></mat-icon>
            </button>
        </div>
    </div>
</div>

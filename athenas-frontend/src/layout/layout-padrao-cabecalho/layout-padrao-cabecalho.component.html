<div
    class="relative flex w-full px-4 py-4 md:px-6 z-49 shadow dark:shadow-none dark:border-b dark:bg-transparent print:hidden h-24 bg-gray-100 flex-col md:flex-row md:items-center justify-between"
>
    <div class="flex flex-col gap-2 px-2">
        <img
            class="w-20"
            *ngIf="isScreenSmall"
            src="assets/images/logo/logo-text.svg"
            alt="Logo image"
        />
    </div>
    <div class="flex justify-between items-center w-full">
        <div class="flex items-center">
            <button
                class="h-full self-center"
                [ngClass]="{ 'flex justify-center': isScreenSmall }"
                mat-icon-button
                *ngIf="isScreenSmall"
                (click)="this.toggleNavigation.emit()"
            >
                <mat-icon
                    *ngIf="isScreenSmall"
                    [svgIcon]="'heroicons_outline:menu'"
                    [ngClass]="{
                        'text-center justify-center': isScreenSmall
                    }"
                ></mat-icon>
            </button>
            <div class="flex flex-col gap-2">
                <div class="flex pl-2 font-bold" *ngIf="isScreenSmall">
                    <div class="text-lg">{{ title | async }}</div>
                </div>
            </div>

            <button
                class="h-full self-center"
                *ngIf="!isScreenSmall"
                [ngClass]="{ 'flex justify-center': isScreenSmall }"
                mat-icon-button
                (click)="this.toggleNavigationAppearance.emit()"
            >
                <mat-icon
                    *ngIf="!isScreenSmall"
                    [svgIcon]="'heroicons_outline:menu'"
                    [ngClass]="{
                        'text-center justify-center': isScreenSmall
                    }"
                ></mat-icon>
            </button>

            <div class="flex pl-2 font-bold">
                <div class="text-lg" *ngIf="!isScreenSmall">
                    {{ title | async }}
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <clock></clock>
            <notifications></notifications>
            <layout-padrao-usuario></layout-padrao-usuario>

            <button
                class="h-full flex gap-2 bg-[#174166] border-blue-900 rounded-full p-2 px-4 text-white text-md self-center justify-center font-bold"
                (click)="irAjuda()"
                *ngIf="!isScreenSmall"
            >
                <div class="text-xl">Ajuda</div>
                <div class="flex self-center">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24px"
                        height="24px"
                        viewBox="0 0 24 24"
                    >
                        <path
                            fill="currentColor"
                            d="M11.95 18q.525 0 .888-.363t.362-.887q0-.525-.362-.888t-.888-.362q-.525 0-.887.363t-.363.887q0 .525.363.888t.887.362m-.9-3.85h1.85q0-.825.188-1.3t1.062-1.3q.65-.65 1.025-1.238T15.55 8.9q0-1.4-1.025-2.15T12.1 6q-1.425 0-2.312.75T8.55 8.55l1.65.65q.125-.45.563-.975T12.1 7.7q.8 0 1.2.438t.4.962q0 .5-.3.938t-.75.812q-1.1.975-1.35 1.475t-.25 1.825M12 22q-2.075 0-3.9-.787t-3.175-2.138q-1.35-1.35-2.137-3.175T2 12q0-2.075.788-3.9t2.137-3.175q1.35-1.35 3.175-2.137T12 2q2.075 0 3.9.788t3.175 2.137q1.35 1.35 2.138 3.175T22 12q0 2.075-.788 3.9t-2.137 3.175q-1.35 1.35-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12q0-3.35-2.325-5.675T12 4Q8.65 4 6.325 6.325T4 12q0 3.35 2.325 5.675T12 20m0-8"
                        />
                    </svg>
                </div>
            </button>

            <button
                class="h-full flex gap-2 bg-[#174166] border-blue-900 rounded-full text-white text-md self-center justify-center font-bold"
                (click)="irAjuda()"
                *ngIf="isScreenSmall"
            >
                <div class="flex self-center">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24px"
                        height="24px"
                        viewBox="0 0 24 24"
                    >
                        <path
                            fill="currentColor"
                            d="M11.95 18q.525 0 .888-.363t.362-.887q0-.525-.362-.888t-.888-.362q-.525 0-.887.363t-.363.887q0 .525.363.888t.887.362m-.9-3.85h1.85q0-.825.188-1.3t1.062-1.3q.65-.65 1.025-1.238T15.55 8.9q0-1.4-1.025-2.15T12.1 6q-1.425 0-2.312.75T8.55 8.55l1.65.65q.125-.45.563-.975T12.1 7.7q.8 0 1.2.438t.4.962q0 .5-.3.938t-.75.812q-1.1.975-1.35 1.475t-.25 1.825M12 22q-2.075 0-3.9-.787t-3.175-2.138q-1.35-1.35-2.137-3.175T2 12q0-2.075.788-3.9t2.137-3.175q1.35-1.35 3.175-2.137T12 2q2.075 0 3.9.788t3.175 2.137q1.35 1.35 2.138 3.175T22 12q0 2.075-.788 3.9t-2.137 3.175q-1.35 1.35-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12q0-3.35-2.325-5.675T12 4Q8.65 4 6.325 6.325T4 12q0 3.35 2.325 5.675T12 20m0-8"
                        />
                    </svg>
                </div>
            </button>
        </div>
    </div>
</div>

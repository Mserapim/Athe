<!-- Notifications toggle -->
<div class="commum">
    <button mat-icon-button (click)="openPanel()" #notificationsOrigin>
        <mat-icon
            class="flex icon-size-8 text-secondary"
            svgIcon="mat_outline:notifications"
        ></mat-icon>
        <ng-container *ngIf="novaNotificacao">
            <div
                class="flex place-content-center items-center absolute min-w-min h-2.5 top-1.5 left-5 rounded-lg p-1.5 text-xs text-center bg-red-500 text-white shadow-[0_2px_2px_0_rgba(0,0,0,0.46)]"
            ></div>
        </ng-container>
    </button>

    <!-- Notifications panel -->
    <ng-template #notificationsPanel>
        <div
            class="fixed inset-0 sm:static sm:inset-auto flex flex-col sm:min-w-min sm:w-90 sm:rounded-2xl overflow-hidden shadow-lg"
        >
            <!-- Header -->
            <div
                class="flex flex-shrink-0 items-center py-0 px-4 bg-[#174166] text-white"
            >
                <div class="sm:hidden -ml-1 mr-3 items-center !text-white">
                    <button mat-icon-button (click)="closePanel()">
                        <mat-icon class="material-icons" class="!text-white">
                            close
                        </mat-icon>
                    </button>
                </div>
                <div class="text-lg font-medium">Notificações</div>
                <div class="ml-auto">
                    <a
                        class="flex flex-auto pl-4 cursor-pointer"
                        [href]="link"
                        target="_blank"
                    >
                        <button
                            mat-icon-button
                            [matTooltip]="'Ver todas as notificações'"
                        >
                            <mat-icon
                                svgIcon="mat_outline:mail"
                                class="icon-size-5 text-current"
                            ></mat-icon>
                        </button>
                    </a>
                </div>
            </div>

            <!-- Content -->
            <div
                class="relative flex flex-col flex-auto sm:max-h-120 divide-y overflow-y-auto bg-card"
                infiniteScroll
                [infiniteScrollDistance]="1"
                [infiniteScrollThrottle]="50"
                (scrolled)="onScroll()"
                [scrollWindow]="false"
            >
                <!-- Notifications -->
                <ng-container
                    *ngFor="
                        let notification of notifications;
                        trackBy: trackByFn
                    "
                >
                    <div
                        class="flex group hover:bg-neutral-50 dark:hover:bg-black"
                    >
                        <!-- Notification with a link -->
                        <ng-container *ngIf="notification.link">
                            <!-- Normal links -->
                            <ng-container *ngIf="!notification.useRouter">
                                <a
                                    class="flex flex-auto py-1 pl-4 cursor-pointer"
                                    [href]="notification.link"
                                >
                                    <ng-container
                                        *ngTemplateOutlet="notificationContent"
                                    ></ng-container>
                                </a>
                            </ng-container>
                            <!-- Router links -->
                            <ng-container *ngIf="notification.useRouter">
                                <a
                                    class="flex flex-auto py-1 pl-4 cursor-pointer"
                                    [routerLink]="notification.link"
                                >
                                    <ng-container
                                        *ngTemplateOutlet="notificationContent"
                                    ></ng-container>
                                </a>
                            </ng-container>
                        </ng-container>

                        <!-- Notification without a link -->
                        <ng-container *ngIf="!notification.link">
                            <div
                                class="flex flex-auto py-1 pl-4 cursor-pointer"
                                (click)="openDialog(notification)"
                            >
                                <ng-container
                                    *ngTemplateOutlet="notificationContent"
                                ></ng-container>
                            </div>
                        </ng-container>
                    </div>

                    <!-- Notification content template -->
                    <ng-template #notificationContent>
                        <div class="flex w-full">
                            <div
                                class="flex w-[15%] overflow-hidden object-cover object-center ng-star-inserted"
                            >
                                <img
                                    src="{{ urlBase }}icones/{{
                                        notification.idSistema
                                    }}.svg"
                                    onerror="this.src='assets/images/sso/vazio-icon.svg'"
                                    class="w-6 h-6 mt-0.5"
                                />
                            </div>
                            <div class="flex flex-col w-[85%]">
                                <ng-container *ngIf="notification.nomeSistema">
                                    <div class="flex w-full">
                                        <div
                                            class="font-semibold line-clamp-1 w-full"
                                            [innerHTML]="
                                                notification.nomeSistema
                                            "
                                        ></div>
                                    </div>
                                </ng-container>
                                <ng-container *ngIf="notification.assunto">
                                    <div
                                        class="line-clamp-2"
                                        [innerHTML]="notification.assunto"
                                    ></div>
                                </ng-container>
                                <div
                                    class="mt-2 text-sm leading-none text-secondary"
                                >
                                    {{
                                        notification.dataNotificacao
                                            | date : "dd/MM/yyyy HH:mm"
                                    }}
                                </div>
                            </div>
                        </div>
                    </ng-template>
                </ng-container>

                <!-- No notifications -->
                <ng-container *ngIf="!notifications || !notifications.length">
                    <div
                        class="flex flex-col flex-auto items-center justify-center sm:justify-start py-12 px-8"
                    >
                        <div
                            class="flex flex-0 items-center justify-center w-14 h-12 rounded-full"
                        >
                            <mat-icon
                                svgIcon="mat_outline:notifications"
                                class="text-primary-500"
                            ></mat-icon>
                        </div>
                        <div class="mt-5 text-2xl font-semibold tracking-tight">
                            Nenhuma Notificação
                        </div>
                        <div
                            class="w-full max-w-max mt-1 text-md text-center text-secondary"
                        >
                            Suas notificações aparecerão aqui.
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </ng-template>
</div>

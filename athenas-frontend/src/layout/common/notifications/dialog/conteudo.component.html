<div mat-dialog-title>
  <div class="text-lg px-4">
    <div class="flex w-160">
      <div class="flex w-[5%] overflow-hidden object-cover object-center ng-star-inserted">
        <img src="{{urlBase}}icones/{{ data.idSistema }}.svg"
        onerror="this.src='assets/images/sso/vazio-icon.svg'" class="w-6 h-6 mt-0.5">
      </div>
      <div class="font-semibold flex flex-col w-[95%] ">
        {{data.nomeSistema}}
      </div>
    </div>
  </div>
  <div class="text-lg px-4 pt-2">Assunto: {{data.assunto}}</div>
</div>
<div class="mt-2 px-4 text-sm leading-none text-secondary">
  {{data.dataNotificacao}}
</div>
<div mat-dialog-content class="px-4 pb-4 pt-14">
  <div [innerHTML]="conteudo"></div>
</div>
<div class="flex-auto w-1/6 px-4 pt-2">
    <button id="btnFecharModalNotificacao" mat-raised-button (click)="onNoClick()" class="text-center p-3 w-24 my-2 text-white bg-primary rounded-lg 
      font-semibold">Fechar</button>
</div>

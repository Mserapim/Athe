<div
    class="fixed top-0 left-0 h-screen flex flex-col gap-4 !z-50 border-gray-300 bg-gray-50 rouded border-r shadow"
    style="z-index: 1000 !important; width: 280px"
    *ngIf="aberto"
>
    <div
        class="flex flex-col gap-2 h-24 bg-gray-100 border-b border-gray-200 p-4 py-2 justify-start"
    >
        <button class="justify-center" mat-icon-button (click)="fechar()">
            <mat-icon [svgIcon]="'heroicons_outline:view-grid'"></mat-icon>
        </button>
        <div class="text-lg font-bold self-start pl-2">Aplicativos</div>
    </div>

    <div class="grid grid-cols-2 gap-1 p-3 cursor-pointer bg-gray-50">
        <div
            class="flex gap-0.5 text-sm font-bold border border-1 rounded bg-gray-50 p-2 h-16 w-39.9"
            (click)="irAthenas()"
        >
            <div class="w-6 h-6 self-center">
                <mat-icon class="material-icons">account_balance</mat-icon>
            </div>
            <div class="self-center">Administrativo</div>
        </div>

        <div
            *ngFor="let modulo of modulos"
            class="flex gap-0.5 text-sm font-bold border border-1 rounded bg-gray-50 p-2 h-16 w-39.9"
            (click)="irModulo(modulo)"
        >
            <div class="w-6 h-6 self-center">
                <mat-icon class="material-icons">{{
                    modulo.icone || "build_circle"
                }}</mat-icon>
            </div>
            <div class="self-center">{{ modulo.nome }}</div>
        </div>
    </div>
</div>

<div class="flex flex-col gap-8">
    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">Gerenciar destinatários</h1>
    </h1>

    <div class="flex flex-col w-full sm:min-w-120 px-6">
        <div class="flex items-center gap-2">
            <mat-form-field class="flex-1">
                <mat-label>Email</mat-label>
                <input matInput placeholder="Digite o email" [(ngModel)]="novoEmail">
            </mat-form-field>
            <mpmt-botao (click)="adicionarEmail()">Adicionar</mpmt-botao>
        </div>
    
        <div *ngIf="listaEmails.length > 0" class="mt-4">
            <h3 class="text-primary py-4">Emails adicionados</h3>
            <ul>
                <li *ngFor="let email of listaEmails; let i = index" class="flex justify-between w-full">
                    <span class="text-left">{{ email }}</span>
                    <button mat-icon-button color="warn" (click)="removerEmail(i)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </li>
            </ul>
        </div>
    </div>

    <div mat-dialog-actions class="flex flex-col sm:flex-row justify-end gap-4">
        <mpmt-botao tipo="borda" (click)="fecharFormulario()"
            >Fechar</mpmt-botao
        >
        <mpmt-botao
            cor="sucesso"
            (click)="confirmarFormulario()"
            [desabilitado]="!formularioValido"
            >Salvar</mpmt-botao
        >
    </div>
</div>

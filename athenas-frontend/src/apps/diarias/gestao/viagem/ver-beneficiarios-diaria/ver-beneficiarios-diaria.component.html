<div class="flex flex-col gap-2" style="min-width: 320px;">
    <div class="flex justify-end">
      <button (click)="fecharFormulario()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  
    <h1 class="font-bold text-lg text-primary" style="padding: 0 24px;">Beneficiários</h1>
  
    <div mat-dialog-content>
        <ng-container *ngFor="let beneficiario of beneficiarios;">
            <p style="padding-bottom: 10px;">{{ beneficiario.servidor_unicode }} - {{ beneficiario.cargo }}</p>
        </ng-container>
    </div>
</div>

<div class="flex flex-col gap-8">
    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">Aguardando ordem bancária - DEFIN</h1>
    </h1>

    <div mat-dialog-content>
        <div class="flex flex-col w-full sm:min-w-120">
            <form
                [formGroup]="formulario"
                class="grid grid-cols-1 gap-2 w-full"
            >   
                <mat-form-field class="w-full">
                    <mat-label>Número da ordem bancária</mat-label>
                    <input matInput formControlName="numeroOrdemBancaria" placeholder=""/>
                </mat-form-field>

                <mat-form-field class="w-full">
                    <mat-label>Data de pagamento</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="dataPagamento" placeholder="">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>

                <mpmt-file-update 
                    [acceptMultiple]="true" 
                    [acceptedFileTypes]="['application/pdf']"
                    (lista_documentos)="receberAnexos($event)">
                </mpmt-file-update>
                <div *ngIf="anexos.length === 0" class="text-red-600 text-sm">Anexo é obrigatório</div>
            </form>
        </div>
    </div>

    <div mat-dialog-actions class="flex flex-col sm:flex-row justify-end gap-4">
        <mpmt-botao tipo="borda" (click)="fecharFormulario()"
            >Fechar</mpmt-botao
        >
        <mpmt-botao
            cor="sucesso"
            (click)="confirmarFormulario()"
            [desabilitado]="!formularioValido"
            >Salvar</mpmt-botao
        >
    </div>
</div>

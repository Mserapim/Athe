<div class="flex flex-col gap-4">
    
    <button class="absolute top-0 right-0 w-15 h-15"
        (click)="fecharFormulario()">
        <mat-icon>close</mat-icon>
    </button>

    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">{{ data.titulo }}</h1>
    </h1>

    <div mat-dialog-content>
        <div class="flex flex-col w-full sm:min-w-120">
            <form
                [formGroup]="formulario"
                class="grid grid-cols-1 gap-2 w-full"
            >   
                <div>
                    <label style="font-weight: 500; color:#1E293B;">Feedback*</label>
                    <mat-radio-group formControlName="feedback" style="display: flex; gap: 20px;">
                        <mat-radio-button value="positivo">
                            <mat-icon style="color: #018c6a;">thumb_up</mat-icon>
                        </mat-radio-button>

                        <mat-radio-button value="negativo">
                            <mat-icon style="color: #f74747;">thumb_down</mat-icon>
                        </mat-radio-button>

                        <mat-radio-button value="alerta">
                            <mat-icon style="color: #fccb1a;">warning</mat-icon>
                        </mat-radio-button>
                    </mat-radio-group>

                    <p *ngIf="this.clickedAnalisar && formulario.get('feedback').hasError('required')"
                        style="color: rgb(191, 0, 0); font-size: 14px; padding-bottom: 15px;">
                        Feedback é obrigatório para análise.
                    </p>
                </div>

                <mpmt-texto-formatado
                    class="w-full"
                    formControlName="informacao"
                    titulo="Análise*"
                ></mpmt-texto-formatado>
                <mat-error *ngIf="formulario.get('informacao')?.hasError('required') && clickedAnalisar">
                    Análise é obrigatória.
                </mat-error>
            </form>
        </div>
    </div>

    <div mat-dialog-actions style="display: flex; justify-content: center; gap: 20px;">
        <mpmt-botao
            (click)="irDeferir(true)">
            Analisar
        </mpmt-botao>
    </div>

</div>

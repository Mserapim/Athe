<div class="flex flex-col gap-8">
    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">Aguardando empenho - DEPLAN</h1>
    </h1>

    <div mat-dialog-content>
        <div class="flex flex-col w-full sm:min-w-120">
            <form
                [formGroup]="formulario"
                class="grid grid-cols-1 gap-2 w-full"
            >   
                <mat-form-field class="w-full">
                    <mat-label>Número do empenho</mat-label>
                    <input matInput formControlName="numeroEmpenho" placeholder=""/>
                </mat-form-field>

                <mpmt-file-update 
                    [acceptMultiple]="true" 
                    [acceptedFileTypes]="['application/pdf']"
                    (lista_documentos)="receberAnexos($event)">
                </mpmt-file-update>
                <div *ngIf="anexos.length === 0" class="text-red-600 text-sm">Anexo é obrigatório para salvar</div>
            </form>
        </div>
    </div>

    <div mat-dialog-actions class="flex flex-col sm:flex-row justify-end gap-4">
        <mpmt-botao tipo="borda" (click)="fecharFormulario()"
            >Fechar</mpmt-botao
        >
        <mpmt-botao
            *ngIf="data.exibirEncaminhar"
            (click)="encaminharDG()"
            >Encaminhar para DG</mpmt-botao
        >
        <mpmt-botao
            cor="sucesso"
            (click)="confirmarFormulario()"
            [desabilitado]="!formularioValido"
            >Salvar</mpmt-botao
        >
    </div>
</div>

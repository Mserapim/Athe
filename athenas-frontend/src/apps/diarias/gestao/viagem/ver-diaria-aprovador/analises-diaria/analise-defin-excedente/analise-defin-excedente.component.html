<div class="flex flex-col gap-4" style="width: 700px;">
    
    <button class="absolute top-0 right-0 w-15 h-15"
        (click)="fecharFormulario()">
        <mat-icon>close</mat-icon>
    </button>

    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">{{ data.titulo }}</h1>
    </h1>

    <div mat-dialog-content>
        <div class="flex flex-col w-full">
            <form [formGroup]="formulario" class="grid grid-cols-1 gap-2 w-full">
                
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1" style="color:#1E293B;">
                        <label style="font-weight: 500;">Quantidade total de diárias calculadas: </label>
                        <p style="padding-top: 10px; padding-left: 10px;">{{ formulario.controls.quantidadeTotal.value }} diárias</p>
                    </div>

                    <div class="flex-1">
                        <mat-form-field class="w-full">
                            <mat-label>Quantidade total de diárias deferidas</mat-label>
                            <input
                                matInput
                                type="number"
                                formControlName="quantidadeDeferida"
                                min="0"
                                step="0.5"
                            />
                            <mat-error *ngIf="formulario.get('quantidadeDeferida').hasError('required') && envioFormulario">
                                Informe um número maior do que 0.
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <mat-form-field class="w-full">
                    <mat-label>GEDOC</mat-label>
                    <input matInput formControlName="gedoc" placeholder=""/>
                    <mat-error *ngIf="formulario.get('gedoc')?.invalid && envioFormulario">
                        GEDOC é obrigatório.
                    </mat-error>
                </mat-form-field>

                <mpmt-file-update 
                    [acceptMultiple]="true" 
                    [acceptedFileTypes]="['application/pdf']"
                    (lista_documentos)="receberAnexos($event)"
                    titulo="Anexos">
                </mpmt-file-update>
                <div 
                    *ngIf="anexos.length === 0 && anexoObrigatorio" 
                    class="text-red-600 text-sm"
                    style="font-size: 12px !important; font-weight: 500;">
                    Anexo é obrigatório ao deferir.
                </div>

            </form>
        </div>
    </div>

    <div style="display: flex; justify-content: center; gap: 20px; margin-top: 40px;">
        <button mat-button color="[#00AC81]" class="bg-[#00AC81] text-white p-8 py-4 w-50" 
            (click)="irAnalisar(true)">
            Deferir
        </button>

        <button mat-button color="[#F87171]" class="bg-[#F87171] text-white p-8 py-4 w-50"
            (click)="irAnalisar(false)">
            Indeferir
        </button>
    </div>

</div>

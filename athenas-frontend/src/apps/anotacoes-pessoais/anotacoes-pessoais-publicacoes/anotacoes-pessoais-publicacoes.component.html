<div class="flex flex-col w-full p-8">
    <div *ngIf="service.loading" class="spinner-container">
        <mat-spinner></mat-spinner>
    </div>

    <mpmt-listagem2 [service]="service">
        <!-- Ações -->
        <div acoes>
            <mpmt-botao (click)="irNovo()" *ngIf="navegacaoAtualService.possuiPermissao('criar')">Nova publicação</mpmt-botao>
        </div>
        <!-- Filtros -->
        <div filtros class="w-full">
            <form
                [formGroup]="service.filtros"
                class="grid grid-cols-1 md:grid-cols-4 gap-2 w-full"
            >
                <mat-form-field class="self-center w-full">
                    <mat-label class="text-white">Palavra chave</mat-label>
                    <input
                        matInput
                        type="text"
                        formControlName="keyword"
                        placeholder="Palavra chave"
                    />
                </mat-form-field>

                <mat-form-field appearance="fill" class="w-full">
                    <mat-label class="text-white">Tipo publicação</mat-label>
                    <mat-select 
                        formControlName="tipo"
                        (ngModelChange)="service.recarregarListagem()" 
                        multiple
                    >
                        <mat-option 
                            *ngFor="let option of service.tipos" 
                            [value]="option.value"
                        >
                            {{ option.label }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </form>
        </div>
    </mpmt-listagem2>
</div>

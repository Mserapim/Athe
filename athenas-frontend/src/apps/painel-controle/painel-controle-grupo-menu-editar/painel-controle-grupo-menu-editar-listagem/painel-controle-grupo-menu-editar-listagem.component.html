<div class="flex flex-col w-full !text-black">
    <!-- Loading Indicator -->
    <div *ngIf="isLoading" class="flex justify-center items-center w-full h-full fixed top-0 left-0 bg-black bg-opacity-50 z-50">
        <div class="loader"></div>
    </div>

    <mpmt-listagem2
        [service]="service"
        [title]="'Grupo de acesso > Menus > Permissões'"
        [habilitar-favorito]="false"
        [ocultarTitulo]="false"
        [ocultarOpcoes]="false"
        [classes]="'!text-black'"
    >
        <!-- Ações -->
        <div acoes>
            <mpmt-botao [cor]="'primario'" (click)="this.irNovo.emit()">
                Adicionar
            </mpmt-botao>
        </div>
        <!-- Filtros -->
        <div filtros class="w-full"></div>
    </mpmt-listagem2>
</div>

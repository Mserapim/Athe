<div class="flex flex-col gap-8">
    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">Menus do Usuário</h1>
    </h1>

    <mat-card>
        <mat-card-content
            >Matricula:
            <span class="font-bold">{{
                data.usuario.matricula
            }}</span></mat-card-content
        >
        <mat-card-content
            >Nome:
            <span class="font-bold">{{
                data.usuario.nome
            }}</span></mat-card-content
        >
        <mat-card-content
            >Login: <span class="font-bold">{{ data.usuario.username }}</span>
        </mat-card-content>
        <mat-card-content
            >Lotação:
            <span class="font-bold">{{
                data.usuario.lotacao
            }}</span></mat-card-content
        >
        <mat-card-content
            >Cargo:
            <span class="font-bold">{{
                data.usuario.cargo
            }}</span></mat-card-content
        >
    </mat-card>

    <div mat-dialog-content>
        <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
            <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
                <button mat-icon-button disabled></button>
                <div class="flex shadow-sm w-full">
                    <span class="w-2/3"> {{ node.name }}</span>
                    <a
                        class="w-1/3 text-blue-600 hover:underline cursor-pointer"
                        >Visualizar permissões</a
                    >
                </div>
            </mat-tree-node>
            <mat-tree-node
                *matTreeNodeDef="let node; when: hasChild"
                matTreeNodePadding
            >
                <button
                    mat-icon-button
                    matTreeNodeToggle
                    [attr.aria-label]="'Toggle ' + node.name"
                >
                    <mat-icon class="mat-icon-rtl-mirror font-bold">
                        {{
                            treeControl.isExpanded(node)
                                ? "expand_more"
                                : "chevron_right"
                        }}
                    </mat-icon>
                </button>
                <span class="font-bold shadow-sm"> {{ node.name }}</span>
            </mat-tree-node>
        </mat-tree>
    </div>

    <div mat-dialog-actions class="flex flex-col sm:flex-row justify-end gap-4">
        <mpmt-botao tipo="borda" [mat-dialog-close]="">Fechar</mpmt-botao>
    </div>
</div>

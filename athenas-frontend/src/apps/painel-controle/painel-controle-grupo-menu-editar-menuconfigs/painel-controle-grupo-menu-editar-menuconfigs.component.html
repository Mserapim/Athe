<div class="flex flex-col w-full h-full">
    DEPRECATED
    <div class="flex flex-row w-full table-responsive">
        <table mat-table [dataSource]="listagem$" class="mat-elevation-z8">
            <template *ngFor="let column of colunasVisiveis | async">
                <ng-container [matColumnDef]="column" *ngIf="column != 'acao'">
                    <th mat-header-cell *matHeaderCellDef>
                        {{ (this.colunas$ | async)[column] }}
                    </th>
                    <td mat-cell *matCellDef="let element">
                        {{ element[column] }}
                    </td>
                </ng-container>
            </template>

            <ng-container matColumnDef="acao">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element">
                    <div class="flex justify-end">
                        <mat-icon
                            svgIcon="heroicons_outline:trash"
                            class="cursor-pointer text-red-500 hover:text-red-700"
                            (click)="deleteItem(element)"
                        ></mat-icon>
                    </div>
                </td>
            </ng-container>

            <tr
                mat-header-row
                *matHeaderRowDef="colunasVisiveisComAcao | async"
            ></tr>
            <tr
                mat-row
                *matRowDef="let row; columns: colunasVisiveisComAcao | async"
            ></tr>
        </table>
    </div>
</div>

<layout-padrao-modal
    [title]="controlarTitulo()"
    [buttons]="modalButtons"
    (close)="fecharFormulario()"
>

    <div mat-dialog-content>
        <div class="flex flex-col w-full sm:min-w-120">
            <form
                [formGroup]="formulario"
                class="grid grid-cols-1 gap-2 w-full"
            >
                <mat-form-field class="w-full" placeholder="Nome completo">
                    <mat-label>Nome do Menu</mat-label>
                    <input matInput formControlName="nome" placeholder="" />
                </mat-form-field>

                <mat-form-field class="w-full" placeholder="Nome completo">
                    <mat-label>Descrição</mat-label>
                    <input
                        matInput
                        formControlName="descricao"
                        placeholder=""
                    />
                </mat-form-field>

                <mat-form-field class="w-full" placeholder="Nome completo">
                    <mat-label>Url</mat-label>
                    <input
                        matInput
                        formControlName="url"
                        placeholder=""
                    />
                </mat-form-field>

                <mat-form-field class="w-full" placeholder="Link de Ajuda">
                    <mat-label>Link de Ajuda</mat-label>
                    <input matInput formControlName="link_de_ajuda" placeholder="" />
                </mat-form-field>

                <mat-form-field class="w-full" placeholder="Ordenação">
                    <mat-label>Ordenação</mat-label>
                    <input
                        matInput
                        type="number"
                        formControlName="ordem"
                        placeholder=""
                        min="0"
                        max="999999"
                    />
                    <mat-error
                        *ngIf="formulario.get('ordem').hasError('required')"
                        >Informe numero entre 0 e 99999</mat-error
                    >
                </mat-form-field>

                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Situação</mat-label>
                    <input
                        matInput
                        [matAutocomplete]="auto2"
                        formControlName="situacao"
                    />
                    <mat-autocomplete #auto2="matAutocomplete">
                        <mat-option
                            *ngFor="let option of situacoes"
                            [value]="option.valor"
                        >
                            {{ option.nome }}
                        </mat-option>
                    </mat-autocomplete>
                </mat-form-field>

                <mpmt-selecao-icones
                    [selectedIcon]="selectedIcon"
                    (iconSelected)="onIconSelected($event)">
                </mpmt-selecao-icones>
            </form>
        </div>
    </div>

</layout-padrao-modal>

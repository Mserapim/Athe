<div class="flex flex-col w-full h-full">
    <div class="flex flex-row w-full table-responsive">
        <table mat-table [dataSource]="listagem$" class="mat-elevation-z8">
            <template *ngFor="let column of colunasVisiveis | async">
                <ng-container [matColumnDef]="column" *ngIf="column != 'acao'">
                    <th mat-header-cell *matHeaderCellDef>
                        {{ (this.colunas$ | async)[column] }}
                    </th>
                    <td mat-cell *matCellDef="let element">
                        {{ element[column] }}
                    </td>
                </ng-container>
            </template>

            <ng-container matColumnDef="acao">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element">
                    <div class="flex justify-end">
                        <button mat-icon-button [matMenuTriggerFor]="editMenu">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                        <mat-menu #editMenu="matMenu">
                            <button mat-menu-item (click)="irEditarGrupo(element)">
                                <mat-icon>edit</mat-icon>
                                Editar grupo de acesso
                            </button>
                            <button mat-menu-item (click)="deleteItem(element)">
                                <mat-icon
                                    svgIcon="heroicons_outline:trash"
                                    class="cursor-pointer text-red-500 hover:text-red-700"
                                ></mat-icon>
                                Excluir
                            </button>
                        </mat-menu>
                    </div>
                </td>
            </ng-container>

            <tr
                mat-header-row
                *matHeaderRowDef="colunasVisiveisComAcao | async"
            ></tr>
            <tr
                mat-row
                *matRowDef="let row; columns: colunasVisiveisComAcao | async"
            ></tr>
        </table>
    </div>
</div>

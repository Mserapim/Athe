<div class="flex flex-col gap-4 w-full text-black">
    <div class="flex justify-between py-2">
        <div class="flex font-bold text-xl">
            <h1 class="font-bold text-lg">{{ title }}</h1>
        </div>
    </div>

    <form [formGroup]="form" class="flex flex-col gap-8">
        <mpmt-arquivo titulo="Arquivo" formControlName="anexo"></mpmt-arquivo>

        <mat-form-field class="self-center w-full">
            <mat-label>
                Observação*<span class="text-red-500"
                    >(Obrigatório)</span
                ></mat-label
            >

            <textarea
                matInput
                type="text"
                formControlName="observacao"
                required
            ></textarea>

            <mat-error *ngIf="form.get('observacao').hasError('required')"
                >Preenchimento Obrigatório</mat-error
            >
        </mat-form-field>
    </form>

    <br />
    <div
        *ngIf="mensagem"
        class="flex bg-red-100 w-full rounded p-2 text-red-700 font-bold text-md"
    >
        {{ mensagem }}
    </div>
    <div
        class="flex flex-col md:flex-row justify-center md:justify-end gap-4 w-full"
    >
        <button
            mat-button
            color=""
            class="p-8 py-4 w-full md:w-1/3"
            (click)="goBack()"
        >
            Voltar
        </button>

        <button
            mat-button
            [disabled]="!form.valid"
            color="primary"
            [ngClass]="{ '!bg-primary': form.valid }"
            class="bg-gray text-white p-8 py-4 w-full md:w-1/3"
            (click)="goConfirmar()"
        >
            Realizar o envio
        </button>
    </div>
</div>

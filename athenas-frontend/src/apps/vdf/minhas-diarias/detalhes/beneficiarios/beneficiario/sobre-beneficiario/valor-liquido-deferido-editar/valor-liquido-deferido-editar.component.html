<div class="flex flex-col gap-4">
    
    <button class="absolute top-0 right-0 w-15 h-15"
        (click)="fecharFormulario()">
        <mat-icon>close</mat-icon>
    </button>

    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">Alterar valor deferido</h1>
    </h1>

    <div mat-dialog-content>
        <div class="flex flex-col w-full sm:min-w-80">

            <form [formGroup]="formulario" class="grid grid-cols-1 gap-2 w-full">

                <div class="flex flex-col" style="color:#1E293B;">
                    <label style="font-weight: 500;">Valor deferido atual: </label>
                    <p style="padding: 0px 20px 10px">
                        {{ extrato.consolidado.valor_liquido_deferido| currency:'BRL':'symbol':'1.2-2' }}
                    </p>
                </div>

                <div class="flex flex-col">
                    <mat-form-field class="w-full">
                        <mat-label>Novo valor deferido</mat-label>
                        <input
                            matInput
                            formControlName="valorDeferido"
                            (ngModelChange)="formatarMoeda($event)"
                        />
                    </mat-form-field>
                </div>

            </form>
        </div>
    </div>
    
    <div mat-dialog-actions style="display: flex; justify-content: center; gap: 20px;">
        <mpmt-botao 
            (click)="irAlterarValor()">
            Alterar valor deferido
        </mpmt-botao>
    </div>

</div>

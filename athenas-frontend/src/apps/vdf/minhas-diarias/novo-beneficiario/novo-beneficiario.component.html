<div class="flex flex-col gap-2">
    <div *ngIf="loading" class="spinner-container">
        <mat-spinner></mat-spinner>
    </div>
    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">Novo beneficiário</h1>
    </h1>
    
    <div class="flex flex-col items-end">
        <button mat-button color="[#174166]" class="bg-[#174166] text-white p-2 w-54" (click)="irDadosBancariosSolicitante()">
            Adicionar próprio solicitante 
        </button>
    </div>

    <div mat-dialog-content>
        <div class="flex flex-col w-full sm:min-w-120">
            <form [formGroup]="formulario" class="grid grid-cols-1 gap-2 w-full">

                <div class="flex flex-col gap-2 m-2">
                    <span style="font-weight: 500; color: rgba(var(--fuse-text-default-rgb), var(--tw-text-opacity));">
                        Origem do servidor
                    </span>
                
                    <mat-radio-group formControlName="servidor_mpmt" class="flex flex-col gap-1"
                    (change)="alterar_tipo_beneficiario()"
                    >
                        <mat-radio-button [value]="true">Beneficiário do quadro do MPMT</mat-radio-button>
                        <mat-radio-button [value]="false">Beneficiário de fora do quadro do MPMT</mat-radio-button>
                    </mat-radio-group>
                </div>

                <div class="grid grid-cols-1 gap-2 w-full m-2">
                    <div appearance="fill" class="w-full">
                        <mpmt-selecao
                            #selecaoServidorComponent
                            [titulo]="'Servidor'"
                            class="w-96"
                            placeholder="Selecione um servidor"
                            formControlName="servidor"
                            [configuracao]="selecaoServidor"
                        ></mpmt-selecao>
                    </div>
                </div>

                <div  class="grid grid-cols-1 gap-2 w-full">
                    <!-- Esta div será exibida quando isTrue for true -->
                    <button mat-button color="[#174166]" class="bg-[#174166] text-white p-2 py-4 w-54" 
                        (click)="irDadosBancariosServidor()" [disabled]="servidorSelecionado()">
                        Selecionar dados bancários
                    </button>
                </div>
                <div *ngIf="!origem_servidor" class="grid grid-cols-1 gap-2 w-full">
                    <!-- Esta div será exibida quando isTrue for false -->
                    <button mat-button color="[#174166]" class="bg-[#174166] text-white p-2 py-4 w-54" (click)="irCriarColaboradorEventual()">
                        Adicionar servidor externo
                    </button>
                </div>
                
            </form>
        </div>
    </div>

    <div mat-dialog-actions class="flex flex-col sm:flex-row justify-end gap-4">
        <mpmt-botao tipo="borda" (click)="fecharFormulario()">Fechar</mpmt-botao>
        
        <!-- <mpmt-botao cor="sucesso" (click)="confirmarFormulario()" >Salvar</mpmt-botao> -->
   
    </div>
</div>

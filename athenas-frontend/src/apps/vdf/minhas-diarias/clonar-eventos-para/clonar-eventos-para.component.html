<div class="flex flex-col gap-8 ">
    <h1 mat-dialog-title>
        <h1 class="font-bold text-lg text-primary">Clonar evento</h1>
    </h1>
    <div mat-dialog-content>
        <div class="flex flex-col w-full sm:min-w-120">
            <h3>Eventos,</h3>
            <div class="grid grid-cols-1 gap-2 w-full p-4 border-solid border-2 border-slate-400 rounded mb-3">
                <div *ngFor="let evento of data.eventos; let i = index; let last = last">
                    <div class="grid grid-cols-2 gap-2 w-full">
                        <div class="w-full" placeholder="Origem">
                            <mat-label></mat-label>
                            {{ evento.unicode }} 
                        </div>
                    </div>

                    <hr class="m-3" *ngIf="!last">
                </div>

            </div>
            <form [formGroup]="formulario"
                class="grid grid-cols-1 gap-2 w-full p-4 border-double border-2 border-slate-400 rounded">
                <div appearance="fill" class="w-full">
                    <mat-label>Selecione pelo menos um beneficiário:</mat-label>

                    <mat-selection-list formControlName='beneficiarios' class="p-2">
                        <mat-list-option *ngFor="let beneficiario of lista_beneficiarios" [value]="beneficiario.id"
                            togglePosition="before">
                            {{ beneficiario.servidor_unicode }}
                        </mat-list-option>
                    </mat-selection-list>
                </div>

            </form>
        </div>
    </div>

    <div mat-dialog-actions class="flex flex-col sm:flex-row justify-end gap-4">
        <mpmt-botao tipo="borda" (click)="fecharFormulario()">Fechar</mpmt-botao>
        <mpmt-botao cor="sucesso" (click)="confirmarFormulario()" [desabilitado]="!formularioValido">Clonar</mpmt-botao>
    </div>
</div>

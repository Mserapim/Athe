<div class="flex flex-col gap-8 w-full text-black">
    <div class="flex flex-col gap-1">
        <h1 class="text-base">Solicitação Licença Saude</h1>

        <p class="text-sm text-gray-600">
            Informe os detalhes do afastamento de saude, preecha data inicio,
            quantidade dias e data fim
        </p>
    </div>

    <form [formGroup]="form" class="flex flex-col w-full">
        <div class="flex flex-col gap-2 pb-4">
            <mat-label class="font-bold text-base text-black"
                >Atestado *</mat-label
            >
            <button
                (click)="fileInput.click()"
                class="flex justify-between gap-4 p-4 outline-dashed outline-gray-100 outline-4 bg-gray-50 text-lg rounded cursor-pointer"
            >
                <div *ngIf="!file" class="w-full text-black">
                    <span>Clique para selecionar um arquivo</span>
                </div>
                <div *ngIf="file" class="w-full text-black">
                    {{ file?.name }}
                </div>

                <input
                    #fileInput
                    type="file"
                    (change)="onFileInput($event)"
                    style="display: none"
                />
                <mat-icon [svgIcon]="'heroicons_solid:paper-clip'"></mat-icon>
            </button>
        </div>

        <div class="flex gap-4 justify-between">
            <mat-radio-group
                aria-label=""
                class="flex flex-col justify-center w-min"
                formControlName="mode"
                (ngModelChange)="onChangeMode($event)"
            >
                <mat-radio-button value="DAY">Dia(s)</mat-radio-button>
                <mat-radio-button value="HOUR">Hora(s)</mat-radio-button>
            </mat-radio-group>

            <div class="flex flex-col md:flex-row gap-2 w-full">
                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Data Início</mat-label>
                    <input
                        matInput
                        [matDatepicker]="datepicker1"
                        [ngModel]="form.value.start_date"
                        (ngModelChange)="onChangeStartDate($event)"
                        formControlName="start_date"
                    />
                    <mat-datepicker-toggle
                        matIconSuffix
                        [for]="datepicker1"
                    ></mat-datepicker-toggle>
                    <mat-datepicker #datepicker1></mat-datepicker>
                </mat-form-field>

                <mat-form-field
                    appearance="fill"
                    class="w-full"
                    *ngIf="form.value.mode == 'DAY'"
                >
                    <mat-label>Quantidade de dias</mat-label>
                    <input
                        type="number"
                        matInput
                        [min]="1"
                        (ngModelChange)="onChangeDays($event)"
                        [ngModel]="form.value.days"
                        formControlName="days"
                    />
                </mat-form-field>

                <mat-form-field
                    appearance="fill"
                    class="w-full"
                    *ngIf="form.value.mode == 'HOUR'"
                >
                    <mat-label>Quantidade de horas</mat-label>
                    <input
                        type="number"
                        matInput
                        [min]="1"
                        [max]="7"
                        (ngModelChange)="onChangeDays($event)"
                        [ngModel]="form.value.hours"
                        formControlName="hours"
                    />
                </mat-form-field>

                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Data Fim</mat-label>
                    <input
                        [ngModel]="form.value.end_date"
                        matInput
                        disabled="true"
                        readonly="true"
                        class=""
                        [matDatepicker]="datepicker2"
                        formControlName="end_date"
                    />
                    <mat-datepicker #datepicker2></mat-datepicker>
                </mat-form-field>
            </div>
        </div>

        <mat-form-field class="w-full">
            <mat-label>Cid(Opcional)</mat-label>
            <input
                type="text"
                placeholder="Selecione o substituto"
                matInput
                [matAutocomplete]="auto2"
                formControlName="cidItem"
                (keyup)="loadCids($event)"
            />
            <mat-autocomplete
                autoActiveFirstOption
                #auto2="matAutocomplete"
                [displayWith]="displayFn"
            >
                <mat-option *ngFor="let item of cids" [value]="item">
                    {{ item.code }} {{ item.description }}
                </mat-option>
            </mat-autocomplete>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Observação (Opcional)</mat-label>
            <textarea matInput placeholder="Observação..."></textarea>
        </mat-form-field>
    </form>

    <div
        *ngIf="message"
        class="flex bg-red-100 w-full rounded p-2 text-red-700 font-bold text-md"
    >
        {{ message }}
    </div>

    <div class="flex gap-4 self-center w-full">
        <button
            mat-button
            class="p-8 py-4 w-full outline outline-1 outline-gray-200"
            (click)="goBack()"
        >
            Voltar
        </button>
        <button
            mat-button
            [ngClass]="{ '!bg-primary': form.valid }"
            class="bg-gray-300 text-white p-8 py-4 w-full"
            (click)="goNext()"
            [disabled]="!form.valid"
        >
            Continuar
        </button>
    </div>
</div>

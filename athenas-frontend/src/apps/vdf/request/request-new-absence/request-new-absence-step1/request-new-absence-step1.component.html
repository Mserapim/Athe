<div class="flex flex-col gap-8 w-full text-black">
    <div class="flex flex-col gap-2">
        <h1 class="text-base">Selecione o tipo de afastamento</h1>

        <p class="text-xs text-gray-600">
            Informe o tipo de afastamento que deseja solicitar e clique em
            continuar.
        </p>
    </div>

    <div class="flex flex-col gap-4 w-full">
        <mat-form-field appearance="fill">
            <mat-label>Selecione o tipo de afastamento</mat-label>
            <mat-select
                [formControl]="myControl"
                placeholder="Tipos de afastamentos"
            >
                <!-- <mat-option>None</mat-option> -->
                <mat-option
                    *ngFor="let item of dataSource.results$ | async"
                    [value]="item.value"
                    >{{ item.label }}</mat-option
                >
            </mat-select>
        </mat-form-field>
    </div>
    <div class="flex justify-end">
        <button
            *ngIf="myControl.value"
            mat-button
            class="bg-primary text-white p-8 py-4 w-56"
            (click)="goNext()"
        >
            Continuar
        </button>
    </div>
</div>

<h1 mat-dialog-title>
    <h1 class="font-bold text-lg text-primary pb-4">
        Opções de filtro avançado
    </h1>
</h1>

<div mat-dialog-content>
    <div class="flex flex-col">
        <form [formGroup]="form" class="flex flex-col gap-8 w-full">
            <mat-form-field class="self-center w-full">
                <input
                    matInput
                    type="text"
                    formControlName="nome"
                    placeholder="Nome completo"
                />
            </mat-form-field>

            <mat-form-field class="self-center w-full">
                <input
                    matInput
                    type="text"
                    formControlName="cpf"
                    placeholder="CPF"
                />
            </mat-form-field>

            <mat-form-field class="self-center w-full">
                <input
                    matInput
                    type="text"
                    formControlName="rg"
                    placeholder="RG"
                />
            </mat-form-field>
        </form>
    </div>
</div>
<div mat-dialog-actions class="justify-end">
    <button mat-button mat-dialog-close pri>Cancelar</button>
    <button
        mat-button
        mat-raised-button
        color="primary"
        cdkFocusInitial
        [mat-dialog-close]="data"
    >
        Filtrar
    </button>
</div>

<!-- [mat-dialog-close]="{request_type: requestType.value}" -->

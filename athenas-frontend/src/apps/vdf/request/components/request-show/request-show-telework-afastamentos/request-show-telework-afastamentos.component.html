<div class="flex flex-col py-2 gap-2 max-h-70 overflow-y-auto">
    <div
        class="flex flex-col gap-4 border border-gray-200 bg-gray-100 rounded p-2 h-full w-full"
    >
        <div class="table-responsive" *ngIf="carregado">
            <table
                mat-table
                [dataSource]="results"
                class=""
                *ngIf="results?.length > 0"
            >
                <ng-container matColumnDef="tipo">
                    <th mat-header-cell *matHeaderCellDef>Tipo</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.tipo }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="data_inicio">
                    <th mat-header-cell *matHeaderCellDef>Data inicio</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.data_inicio | date : "dd/MM/yyyy" }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="data_fim">
                    <th mat-header-cell *matHeaderCellDef>Data fim</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.data_fim | date : "dd/MM/yyyy" }}
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns"
                ></tr>
            </table>

            <div class="flex self-center" *ngIf="results?.length <= 0">
                Não há afastamento na referência {{ this.reference }}
            </div>
        </div>
    </div>
</div>

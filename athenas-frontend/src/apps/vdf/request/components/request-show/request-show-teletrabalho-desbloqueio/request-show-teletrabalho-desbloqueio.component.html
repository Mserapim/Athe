<div class="flex flex-col py-2 gap-2 overflow-y-auto">
    <div
        class="flex flex-col gap-4 border border-gray-200 bg-gray-100 rounded p-2 h-full w-full"
    >
        <div class="font-bold">Anotações</div>
        <div class="table-responsive">
            <table mat-table [dataSource]="results">
                <ng-container matColumnDef="nome_arquivo">
                    <th mat-header-cell *matHeaderCellDef>Nome do arquivo</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element?.nome_arquivo }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="origem">
                    <th mat-header-cell *matHeaderCellDef>Origem</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element?.origem }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef width="100px">
                        Arquivo
                    </th>
                    <td mat-cell *matCellDef="let element">
                        <button
                            *ngIf="element?.id"
                            class="bg-primary text-white w-min"
                            (click)="download(element.id)"
                            mat-button
                        >
                            Download
                        </button>
                    </td>
                </ng-container>

                <!-- <ng-container matColumnDef="observation">
                    <th mat-header-cell *matHeaderCellDef>Observação</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="group">
                            {{ element.observation?.substring(0, 30) }}
                            <div
                                *ngIf="
                                    element.observation &&
                                    element.observation?.length > 30
                                "
                                rk
                                class="font-bold text-black cursor-pointer"
                                (click)="goDetail(element)"
                            >
                                ver mais
                            </div>
                        </div>
                    </td>
                </ng-container> -->

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns"
                ></tr>
            </table>
        </div>
    </div>
</div>

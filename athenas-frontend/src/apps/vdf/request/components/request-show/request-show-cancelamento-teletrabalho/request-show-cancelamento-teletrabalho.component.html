<div class="flex flex-col py-2 gap-2">
    <div class="table-responsive max-h-90 overflow-y-auto custom-scrollbar w-full">
        <table mat-table [dataSource]="results">
            <ng-container matColumnDef="tipo_solicitacao">
                <th mat-header-cell *matHeaderCellDef>Tipo Solicitação</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.tipo_solicitacao }}
                </td>
            </ng-container>

            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef>Data Solicitacao</th>
                <td mat-cell *matCellDef="let element">
                    {{printDate(element.date) }}
                </td>
            </ng-container>

            <ng-container matColumnDef="referencia">
                <th mat-header-cell *matHeaderCellDef>Referência</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.referencia }}
                </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Situação</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.status }}
                </td>
            </ng-container>

            <ng-container matColumnDef="inicio_plano">
                <th mat-header-cell *matHeaderCellDef>Início Plano</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.inicio_plano }}
                </td>
            </ng-container>

            <ng-container matColumnDef="fim_plano">
                <th mat-header-cell *matHeaderCellDef>Fim Plano</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.fim_plano }}
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>
    </div>
</div>

<div class="flex flex-col py-2 gap-2 overflow-y-auto">
    <div class="table-responsive">
        <table mat-table [dataSource]="results">
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Descrição</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.description }}
                </td>
            </ng-container>

            <ng-container matColumnDef="doc_origin_display">
                <th mat-header-cell *matHeaderCellDef>Origem do documento</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.doc_origin_display }}
                </td>
            </ng-container>

            <ng-container matColumnDef="attachment">
                <th mat-header-cell *matHeaderCellDef style="width: 100px">
                    <div class="flex justify-center">Anexo</div>
                </th>
                <td mat-cell *matCellDef="let element">
                    <div class="flex justify-end">
                        <button
                            mat-button
                            class="bg-primary text-white w-min"
                            (click)="download(element.attachment)"
                        >
                            Baixar Anexo
                        </button>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="delete">
                <th mat-header-cell *matHeaderCellDef style="width: 50px"></th>
                <td mat-cell *matCellDef="let element">
                    <mat-icon
                        *ngIf="isAguardandoEnvio && element.doc_origin !== 13"
                        [svgIcon]="'heroicons_outline:trash'"
                        class="cursor-pointer"
                        (click)="removerItem(element)"
                    ></mat-icon>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <request-observation-alert
            [requestId]="requestId"
        ></request-observation-alert>
    </div>
</div>

<div class="flex flex-col py-2 gap-2 overflow-y-auto">
    <div
        class="flex flex-col gap-4 border border-gray-200 bg-gray-100 rounded p-2 h-full w-full"
    >
<!--        <div class="font-bold">Metas</div>-->
        <div class="table-responsive">
            <table mat-table [dataSource]="getResults()">
                <ng-container matColumnDef="tipo_solicitacao_display">
                    <th mat-header-cell *matHeaderCellDef>Tipo</th>
                    <td mat-cell *matCellDef="let element">
                        Inclusão de direito
                    </td>
                </ng-container>

                <ng-container matColumnDef="data_inicio">
                    <th mat-header-cell *matHeaderCellDef>Data de inicio</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.data_inicio | date : "dd/MM/yyyy"}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="data_fim">
                    <th mat-header-cell *matHeaderCellDef>Data fim</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.data_fim | date : "dd/MM/yyyy"}}
                    </td>
                </ng-container>

                <ng-container matColumnDef="dias">
                    <th mat-header-cell *matHeaderCellDef>Quantidade de dias</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.dias }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="observacao">
                    <th mat-header-cell *matHeaderCellDef>Observação</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="group">
                            {{ element.observacao?.substring(0, 30) }}
                            <div
                                *ngIf="
                                    element.observacao &&
                                    element.observacao?.length > 30
                                "
                                rk
                                class="font-bold text-black cursor-pointer"
                                (click)="goDetail(element)"
                            >
                                ver mais
                            </div>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns"
                ></tr>
            </table>
        </div>
    </div>
</div>

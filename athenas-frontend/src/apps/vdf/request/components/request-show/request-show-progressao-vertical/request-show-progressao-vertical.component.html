<div class="flex flex-col py-2 gap-2 overflow-y-auto">
    <div class="flex flex-col">
        <button
            mat-button
            class="bg-primary text-white w-full self-center md:self-end md:w-min"
            (click)="goCreate()"
        >
            Adicionar
        </button>

        <table mat-table [dataSource]="results">
            <ng-container matColumnDef="doc_origin">
                <th mat-header-cell *matHeaderCellDef>Etapa</th>
                <td mat-cell *matCellDef="let element">
                    {{ requestStepLabel(element.doc_origin) }}
                </td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Descrição</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.description }}
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>
                    <div class="flex justify-end">#</div>
                </th>
                <td mat-cell *matCellDef="let element">
                    <div class="flex flex-row gap-2 justify-end">
                        <div>
                            <a
                                mat-flat-button
                                class="text-black"
                                (click)="download(element.attachment)"
                            >
                                <mat-icon
                                    [svgIcon]="'heroicons_solid:paper-clip'"
                                    class="w-6 h-6"
                                ></mat-icon>
                            </a>
                        </div>
                        <div>
                            <a
                                mat-flat-button
                                class="text-red-500"
                                (click)="goRemove(element)"
                            >
                                <mat-icon
                                    [svgIcon]="'heroicons_solid:trash'"
                                    class="w-6 h-6"
                                ></mat-icon>
                            </a>
                        </div>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <!-- <div class="flex flex-row w-full">
            <td>
                <input mat-input class="bg-gray-100 border w-full" />
            </td>

            <td>
                {{ "teste" }}
            </td>

            <td>
                <mat-icon
                    [svgIcon]="'heroicons_outline:trash'"
                    class="cursor-pointer"
                ></mat-icon>
            </td>
        </div> -->
    </div>
</div>

<div class="flex flex-col h-full w-full">
    <div class="flex flex-col gap-2 sm:flex-row w-full justify-between">
        <div class="flex flex-col w-full">
            <h3 class="font-bold text-xl">Nova solicitação</h3>
            <h3 class="text-sm">
                Clique sobre o tipo de solicitação para iniciar
            </h3>
        </div>
        <mat-form-field class="w-full sm:w-56">
            <input
                matInput
                [(ngModel)]="query"
                (ngModelChange)="filter()"
                placeholder="Pesquisar solicitação"
            />
        </mat-form-field>
    </div>

    <div
        class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-4 overflow-y-auto"
    >
        <div
            class="flex flex-col border border-gray-100 bg-gray-50 p-4 rounded cursor-pointer hover:bg-primary/12"
            *ngFor="let menuItem of filtered"
            (click)="goLink(menuItem)"
        >
            <div class="flex gap-2 justify-between">
                <div
                    class="font-bold text-lg flex flex-col text-center md:text-left"
                >
                    {{ menuItem.label }}
                </div>
            </div>
            <div class="font-normal text-base flex text-black justify-between items-center">
                {{ menuItem.description }}
                <div
                    class="rounded-full bg-primary/10 self-center w-min px-2 text-center text-primary text-xs border border-primary"
                >
                    Iniciar
                </div>
            </div>
        </div>
    </div>
</div>

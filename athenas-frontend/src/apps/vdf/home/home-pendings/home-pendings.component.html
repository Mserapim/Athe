<div class="flex flex-col gap-4 w-full" *ngIf="pendings?.length > 0">
    <h1 class="font-bold text-lg">Minhas Pendências</h1>

    <div class="flex gap-4 overflow-x-auto">
        <div
            class="flex bg-white p-2 rounded gap-2 shadow cursor-pointer min-w-56 max-w-56"
            (click)="go(item)"
            *ngFor="let item of pendings"
        >
            <div class="self-center">
                <mat-icon [svgIcon]="'heroicons_solid:check-circle'"></mat-icon>
            </div>
            <div class="flex flex-col gap-2">
                <div class="text-gray-400 font-bold">{{ item.title }}</div>
                <div class="text-gray-800 text-xs">{{ item.message }}</div>
            </div>
        </div>
    </div>
</div>

<div class="flex flex-col gap-4 w-full">
    <div class="flex gap-4 justify-between border-b border-gray-200 pb-2">
        <p class="text-lg font-bold py-4 self-center">Incluir novo Plantão</p>
    </div>
    <form [formGroup]="form" class="flex flex-col w-full">
        <mat-form-field appearance="fill" class="w-full">
            <mat-label>Tipo de plantão</mat-label>
            <mat-select
                [disabled]="disabled"
                [(ngModel)]="form.value.type"
                formControlName="type"
            >
                <mat-option
                    *ngFor="let option of types"
                    [value]="option.value"
                    >{{ option.label }}</mat-option
                >
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full">
            <mat-label>Plantonista</mat-label>
            <input
                matInput
                disabled="true"
                [matAutocomplete]="auto"
                (ngModelChange)="onChangeSearchEmployee($event)"
                formControlName="employee"
            />
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
                <mat-option
                    *ngFor="let option of dataSourceEmployee.results$ | async"
                    [value]="option"
                >
                    {{ option.name }}
                </mat-option>
            </mat-autocomplete>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full">
            <mat-label>Lotação</mat-label>
            <input
                matInput
                disabled="true"
                [matAutocomplete]="autoWorkplace"
                (ngModelChange)="onChangeSearchWorkplaces($event)"
                formControlName="workplace"
            />
            <mat-autocomplete
                #autoWorkplace="matAutocomplete"
                [displayWith]="displayFn"
            >
                <mat-option
                    *ngFor="let option of dataSourceWorkplaces.results$ | async"
                    [value]="option"
                >
                    {{ option.name }}
                </mat-option>
            </mat-autocomplete>
        </mat-form-field>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 justify-between">
            <mat-form-field appearance="fill" class="w-full">
                <mat-label>Data Início</mat-label>
                <input
                    matInput
                    disabled="true"
                    [matDatepicker]="datepicker1"
                    [ngModel]="form.value.start"
                    (ngModelChange)="onChangeStartDate($event)"
                    formControlName="start"
                />
                <mat-datepicker-toggle
                    matIconSuffix
                    [for]="datepicker1"
                ></mat-datepicker-toggle>
                <mat-datepicker #datepicker1></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-full">
                <mat-label>Quantidade de dias</mat-label>
                <input
                    type="number"
                    matInput
                    [min]="1"
                    disabled="true"
                    (ngModelChange)="onChangeDays($event)"
                    [ngModel]="form.value.days"
                    formControlName="days"
                />
            </mat-form-field>

            <mat-form-field appearance="fill" class="w-full">
                <mat-label>Data Fim</mat-label>
                <input
                    [ngModel]="form.value.end"
                    matInput
                    disabled="true"
                    readonly="true"
                    class=""
                    [matDatepicker]="datepicker2"
                    formControlName="end"
                />
                <mat-datepicker #datepicker2></mat-datepicker>
            </mat-form-field>
        </div>

        <div
            class="bg-red-100 border border-red-300 text-red-500 p-2 mb-4 rounded"
            *ngIf="message"
        >
            {{ message }}
        </div>

        <div class="flex gap-4 self-center">
            <button
                mat-button
                color="primary"
                class="bg-primary text-white p-8 py-4 w-full"
                [mat-dialog-close]=""
            >
                Fechar
            </button>
        </div>
    </form>
</div>

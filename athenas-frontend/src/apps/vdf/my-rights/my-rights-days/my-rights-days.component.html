<div class="flex flex-col w-full gap-4">
    <span class="font-bold text-xl">Anexos do periodo aquisitivo</span>

    <div class="flex w-full flex-col gap-8">
        <div class="flex flex-col table-responsive">
            <table mat-table [dataSource]="results" class="">
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Descrição</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.description }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="start_date">
                    <th mat-header-cell *matHeaderCellDef>Inicio</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.start_date | date : "dd.MM.YYYY" }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="end_date">
                    <th mat-header-cell *matHeaderCellDef>Fim</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.end_date | date : "dd.MM.YYYY" }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="days">
                    <th mat-header-cell *matHeaderCellDef>Dia(s)</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.days }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="information">
                    <th mat-header-cell *matHeaderCellDef>Informações</th>
                    <td mat-cell *matCellDef="let element">
                        {{ element.information }}
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns"
                ></tr>
            </table>
        </div>
        <button
            mat-button
            class="p-8 py-4 w-full outline outline-1 outline-gray-200 bg-white"
            (click)="goClose()"
        >
            Fechar
        </button>
    </div>
</div>

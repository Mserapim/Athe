<layout-padrao-modal
    title= 'Editar Marcação'
    [buttons]="modalButtons"
    (close)="fecharFormulario()"
    style="max-height: 80vh;"
>

    <div mat-dialog-content>
        <div class="flex flex-col sm:min-w-120 w-96">
            <form
                [formGroup]="formulario"
                class="grid grid-cols-1 gap-2 w-full"
            >
                <div class="flex flex-col gap-2 p-4 bg-gray-50">
                    <div class="grid grid-cols-2">
                        <div class="font-bold">Horas previstas</div>
                        <div class="">{{ data?.marcacao?.carga_horaria }}</div>

                        <div class="font-bold">Horas trabalhadas</div>
                        <div class="">{{ data?.marcacao?.total_dia }}</div>

                        <div class="font-bold">Saldo do dia</div>
                        <div class="">{{ data?.marcacao?.saldo_dia }}</div>
                    </div>
                </div>

                <div
                    class="flex bg-yellow-100 border border-yellow-600 p-4 font-bold"
                    *ngIf="
                        !data?.marcacao?.marcacoes?.length ||
                        data?.marcacao?.marcacoes?.length <= 0
                    "
                >
                    Não há marcações
                </div>

                <table
                    class="table bg-gray-50"
                    *ngIf="data?.marcacao?.marcacoes?.length > 0"
                >
                    <thead class="w-full">
                        <th
                            class="flex self-start font-bold py-2 px-4 w-full gap-2"
                        >
                            Registros do dia
                            <div class="text-red-500">
                                {{ data?.marcacao?.data }}
                            </div>
                        </th>
                        <th class="py-2 px-4 w-1/3">Ignorar batida</th>
                    </thead>
                    <tr
                        class="gap-2 p-4 bg-gray-50"
                        *ngFor="let marcacao of data?.marcacao?.marcacoes"
                    >
                        <td class="py-2 px-4 font-bold">
                            {{ marcacao?.marcacao_hora }}
                        </td>

                        <td class="py-2 px-4 text-center">
                            <mat-checkbox
                                color="primary"
                                [checked]="ehSelecionado(marcacao)"
                                (change)="mudarSelecionado($event, marcacao)"
                            >
                                <mat-label></mat-label>
                            </mat-checkbox>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</layout-padrao-modal>
